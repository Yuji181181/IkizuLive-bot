name: Weekly Activity Log Post

on:
  schedule:
    # 毎週日曜日 13:00 UTC = 22:00 JST
    - cron: '0 13 * * 0'
  workflow_dispatch:

jobs:
  post-weekly-log:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run bot
        id: bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          uv run python main.py 2>&1 | tee bot_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Get execution time
        id: time
        run: |
          echo "jst=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      
      - name: Extract error message
        if: steps.bot.outcome == 'failure'
        id: error
        run: |
          ERROR_MSG=$(tail -n 20 bot_output.log | grep -E "✗|Error|Exception" | head -n 5 || echo "詳細はワークフローログを確認してください")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Discord notification
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Discord webhook not configured"
            exit 0
          fi
          
          if [ "${{ steps.bot.outcome }}" == "success" ]; then
            # 成功時の通知
            curl -X POST -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "✅ 週次活動ログ投稿 - 成功",
                  "description": "イキヅライブ！の週次活動ログが正常に投稿されました。",
                  "color": 3066993,
                  "fields": [
                    {
                      "name": "📅 実行時刻 (JST)",
                      "value": "'"${{ steps.time.outputs.jst }}"'",
                      "inline": true
                    },
                    {
                      "name": "🔗 ワークフロー",
                      "value": "[実行ログを確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                      "inline": true
                    },
                    {
                      "name": "📊 ステータス",
                      "value": "全ての処理が正常に完了しました",
                      "inline": false
                    }
                  ],
                  "timestamp": "'"${{ steps.time.outputs.utc }}"'",
                  "footer": {
                    "text": "IkizuLive Bot"
                  }
                }]
              }' \
              "$WEBHOOK"
          else
            # 失敗時の通知
            ERROR_DETAIL="${{ steps.error.outputs.message }}"
            curl -X POST -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "❌ 週次活動ログ投稿 - 失敗",
                  "description": "イキヅライブ！の週次活動ログ投稿に失敗しました。",
                  "color": 15158332,
                  "fields": [
                    {
                      "name": "📅 実行時刻 (JST)",
                      "value": "'"${{ steps.time.outputs.jst }}"'",
                      "inline": true
                    },
                    {
                      "name": "🔗 ワークフロー",
                      "value": "[実行ログを確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                      "inline": true
                    },
                    {
                      "name": "❗ エラー内容",
                      "value": "```\n'"${ERROR_DETAIL}"'\n```",
                      "inline": false
                    },
                    {
                      "name": "🔧 考えられる原因",
                      "value": "• Cookie期限切れ\n• API制限\n• ネットワークエラー\n• 認証エラー",
                      "inline": false
                    },
                    {
                      "name": "💡 対処方法",
                      "value": "1. 上記のワークフローログで詳細を確認\n2. Cookie期限切れの場合は再取得\n3. GitHub Secretsを更新\n4. 手動で再実行",
                      "inline": false
                    }
                  ],
                  "timestamp": "'"${{ steps.time.outputs.utc }}"'",
                  "footer": {
                    "text": "IkizuLive Bot"
                  }
                }]
              }' \
              "$WEBHOOK"
          fi
