name: Weekly Activity Log Post

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

jobs:
  post-weekly-log:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - name: Install dependencies
        run: uv sync
      
      - name: Debug - Check environment variables
        run: |
          echo "GROQ_API_KEY is set: ${{ secrets.GROQ_API_KEY != '' }}"
          echo "TWITTER_COOKIES_JSON is set: ${{ secrets.TWITTER_COOKIES_JSON != '' }}"
          echo "DISCORD_WEBHOOK_URL is set: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}"
          if [ -n "$TWITTER_COOKIES_JSON" ]; then
            echo "TWITTER_COOKIES_JSON length: ${#TWITTER_COOKIES_JSON}"
          else
            echo "TWITTER_COOKIES_JSON is empty!"
          fi
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
      
      - name: Run bot
        id: bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: uv run python main.py
        continue-on-error: true
      
      - name: Discord Success
        if: steps.bot.outcome == 'success'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content":"✅ 週次活動ログ投稿が成功しました！"}' \
              "$WEBHOOK"
          fi
      
      - name: Discord Failure
        if: steps.bot.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content":"❌ 週次活動ログ投稿が失敗しました。ワークフローログを確認してください。"}' \
              "$WEBHOOK"
          fi
