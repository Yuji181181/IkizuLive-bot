name: Weekly Activity Log Post

on:
  schedule:
    # 毎週日曜日 13:00 UTC (22:00 JST)
    - cron: '0 13 * * 0'
  
  # 手動実行も可能
  workflow_dispatch:

jobs:
  post-weekly-log:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv sync
      
      - name: Run weekly bot
        id: bot_run
        env:
          # Groq API
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
          # Twitter Cookie (for twikit)
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          uv run python main.py
        continue-on-error: true
      
      - name: Notify Discord on Success
        if: steps.bot_run.outcome == 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ 週次活動ログ投稿 - 成功\",
                \"description\": \"イキヅライブ！の週次活動ログが正常に投稿されました。\",
                \"color\": 3066993,
                \"fields\": [
                  {
                    \"name\": \"ワークフロー\",
                    \"value\": \"Weekly Activity Log Post\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"実行時刻 (JST)\",
                    \"value\": \"$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"詳細\",
                    \"value\": \"[ワークフロー実行を確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
                  }
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
      
      - name: Notify Discord on Failure
        if: steps.bot_run.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ 週次活動ログ投稿 - 失敗\",
                \"description\": \"イキヅライブ！の週次活動ログ投稿に失敗しました。\",
                \"color\": 15158332,
                \"fields\": [
                  {
                    \"name\": \"ワークフロー\",
                    \"value\": \"Weekly Activity Log Post\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"実行時刻 (JST)\",
                    \"value\": \"$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"考えられる原因\",
                    \"value\": \"• Cookie期限切れ\\n• API制限\\n• ネットワークエラー\"
                  },
                  {
                    \"name\": \"対処方法\",
                    \"value\": \"1. ワークフローログを確認\\n2. Cookieを再取得してSecretsを更新\\n3. 手動で再実行\"
                  },
                  {
                    \"name\": \"詳細ログ\",
                    \"value\": \"[ワークフロー実行を確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
                  }
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
